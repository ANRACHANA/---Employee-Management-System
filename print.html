<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>បោះពុម្ព និង ទាញយកប័ណ្ណបុគ្គលិក (Print & Download Cards)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 🇰🇭 🇨🇳 Google Fonts (Battambang, Moul, Noto Sans SC) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Moul&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Moul&display=swap" rel="stylesheet">
    <!-- 📄 Library សម្រាប់ Download ជា PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        *, ::before, ::after {
            box-sizing: border-box !important;
        }

        body, .id-card-print {
            font-family: 'Battambang', 'Khmer OS Battambang', sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 0;
        }

        /* 🖨️ កំណត់ Settings ពេល Print ដាច់ខាតកុំឱ្យលើសទំព័រ */
        @media print {
            .no-print, .delete-btn {
                display: none !important;
            }
            body {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .a4-page {
                box-shadow: none !important;
                border: none !important;
                margin: 0 !important;
                page-break-after: always !important;
                break-after: page !important;
            }
            @page {
                size: A4 portrait;
                margin: 0mm;
            }
        }

        /* លាក់ប៊ូតុងពេល Export ជា PDF */
        .hide-for-pdf .delete-btn,
        .hide-for-pdf .no-print {
            display: none !important;
        }

        /* ទំហំ A4 Perfect Centering */
        .a4-page {
            width: 210mm;
            height: 297mm;
            margin: 0 auto;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            overflow: hidden;
            page-break-after: always !important;
            break-after: page !important;
            position: relative;
        }

        /* ❌ ការពារកុំឱ្យចេញទំព័រទទេនៅទំព័រចុងក្រោយ */
        .a4-page:last-child {
            margin-bottom: 0 !important;
            page-break-after: avoid !important;
            break-after: avoid !important;
            page-break-before: avoid !important;
        }

        /* Grid 2x2 ចំកណ្តាល A4 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 70mm);
            grid-template-rows: repeat(2, 102mm);
            gap: 12mm 16mm;
            justify-content: center;
            align-content: center;
            width: 100%;
            height: 100%;
        }

        /* 🎯 កន្លែងកែតម្រូវទំព័រខាងក្រោយឱ្យត្រួតស៊ីគ្នា ១០០% */
        .back-page-adjust {
            transform: translate(3.0mm, -0.1mm) !important;
        }

        /* ទំហំប័ណ្ណ ទទឹង 7cm (70mm) x កម្ពស់ 10.2cm (102mm) */
        .id-card-print {
            width: 70mm !important;
            height: 102mm !important;
            box-sizing: border-box !important;
            page-break-inside: avoid;
            border-radius: 0px !important;
            position: relative;
        }
    </style>
</head>
<body class="py-6">

    <!-- Action Bar -->
    <div class="no-print max-w-4xl mx-auto mb-6 px-4 flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-id-card text-indigo-600 text-xl"></i>
            <div>
                <h1 class="font-bold text-sm text-slate-800">ទំព័របោះពុម្ព និង ទាញយកប័ណ្ណបុគ្គលិក</h1>
                <p class="text-xs text-slate-500">ខ្នាត 7cm x 10.2cm</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="window.close()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-xs font-medium transition">
                <i class="fa-solid fa-xmark"></i> បិទទំព័រ
            </button>
            
            <!-- ប៊ូតុង Download ជា PDF -->
            <button id="btnPdf" onclick="downloadPDF()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-medium transition shadow flex items-center gap-1.5">
                <i class="fa-solid fa-file-pdf text-sm"></i> Download PDF
            </button>

            <!-- ប៊ូតុង Print -->
            <button onclick="window.print()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-medium transition shadow flex items-center gap-1.5">
                <i class="fa-solid fa-print"></i> បោះពុម្ព (Print)
            </button>
        </div>
    </div>

    <!-- Print Render Area -->
    <div id="printPageArea" class="flex flex-col items-center"></div>

    <script>
        let currentWorkers = [];

        document.addEventListener('DOMContentLoaded', () => {
            const rawData = localStorage.getItem('print_selected_workers');
            if (rawData) {
                try {
                    currentWorkers = JSON.parse(rawData);
                } catch(e) {
                    currentWorkers = [];
                }
            }
            renderCards();
        });

        function renderCards() {
            const printArea = document.getElementById('printPageArea');

            if (!currentWorkers || currentWorkers.length === 0) {
                printArea.innerHTML = `<div class="p-8 text-center text-slate-500 text-sm bg-white rounded-xl border border-slate-200">ពុំមានទិន្នន័យប័ណ្ណត្រូវបង្ហាញឡើយ!</div>`;
                return;
            }

            const cardsPerPage = 4;
            let pagesHtml = '';

            for (let i = 0; i < currentWorkers.length; i += cardsPerPage) {
                const chunk = currentWorkers.slice(i, i + cardsPerPage);
                
                // 1️⃣ ទំព័រខាងមុខ (FRONT SIDE PAGE)
                pagesHtml += `<div class="a4-page shadow-md mb-6 border border-slate-200"><div class="card-grid">`;
                chunk.forEach((emp, chunkIdx) => {
                    const globalIndex = i + chunkIdx;

                    let photoHtml = '';
                    if (emp.Photo && emp.Photo.trim() !== '') {
                        photoHtml = `<img src="${escapeHtml(emp.Photo)}" alt="Photo" class="w-full h-full object-cover">`;
                    } else {
                        photoHtml = `<i class="fa-solid fa-user text-2xl text-indigo-900"></i>`;
                    }

                    // 🔍 ពិនិត្យមើលផ្នែក (Department) សម្រាប់បង្ហាញប្រអប់ចំណងជើង
                 // 🔍 ពិនិត្យមើលផ្នែក (Department) សម្រាប់បង្ហាញប្រអប់ចំណងជើង
                    let cardTitleHtml = '';
                    const dept = (emp.DepartmentName || '').trim().toLowerCase();

                    if (dept.includes('office') || dept.includes('办公室')) {
                        cardTitleHtml = `
                            <div class="border-2 border-[#2b5b84] rounded-sm px-1 py-1 text-center flex flex-col items-center justify-center leading-tight">
                                <span class="text-[9px] text-black font-normal" style="font-family: 'Khmer OS Muol Light', 'Moul', serif;">
                                    កាតសម្គាល់ បុគ្គលិក
                                </span>
                            </div>
                        `;
                    } else {
                        cardTitleHtml = `
                            <div class="border-2 border-[#2b5b84] rounded-sm px-1 py-1 text-center flex items-center justify-center">
                                <span class="text-[9px] text-black font-normal leading-tight" style="font-family: 'Khmer OS Muol Light', 'Moul', serif;">
                                    កាតសម្គាល់កម្មករ និយោជិត
                                </span>
                            </div>
                        `;
                    }

                    pagesHtml += `
                        <div class="id-card-print bg-white border-2 border-[#2b5b84] overflow-hidden text-slate-800 flex flex-col justify-between p-1.5 shadow-sm rounded-none group">
                            
                            <!-- ❌ ប៊ូតុងលុបកាត -->
                            <button onclick="removeCard(${globalIndex})" 
                                    title="លុបប័ណ្ណនេះចេញ" 
                                    class="delete-btn no-print absolute -top-2 -right-2 bg-red-500 hover:bg-red-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs shadow transition-transform transform hover:scale-110 z-20">
                                <i class="fa-solid fa-xmark"></i>
                            </button>

                            <!-- 1. Card Header (ឈ្មោះក្រុមហ៊ុន) -->
                            <div class="bg-white text-center flex flex-col items-center justify-center rounded-none space-y-0.5 pt-0.5">
                                <span class="text-[9px] text-black font-normal leading-tight" style="font-family: 'Khmer OS Muol Light', 'Moul', serif;">រោងចក្រកាត់ដេរ និងចាក់សម្លៀកបំពាក់</span>
                                <span class="text-[9px] text-black font-normal leading-tight" style="font-family: 'Khmer OS Muol Light', 'Moul', serif;">លីឌីង ស្តារ(ខេមបូឌា)​ហ្គាម៉ិន ឯ.ក</span>
                                <span class="text-[12px] text-black font-normal leading-tight" style="font-family: 'SimSun', 'SimSun', sans-serif;">承杰(柬埔寨)紡織有限公司</span>
                                <span class="text-[10px] text-black font-normal tracking-tighter uppercase leading-tight" style="font-family: Algerian, sans-serif;">LEADING STAR (CAMBODIA) GARMENTS CO., LTD</span>
                            </div>

                            <!-- 2. ប្រអប់ចំណងជើង (Office ឬ កម្មករ និយោជិត) -->
                       <!-- 2. ប្រអប់ចំណងជើង (Office ឬ កម្មករ និយោជិត) -->
                        <div class="-mt-5 mb-0.5 flex justify-center">
                            ${cardTitleHtml}
                        </div>

                            <!-- 3. កន្លែងដាក់រូបថតបុគ្គលិក -->
                            <div class=" -mt-5 flex justify-center my-0.5">
                                <div class="w-16 h-20
                                 border-2 border-[#2b5b84] flex items-center justify-center bg-slate-50 overflow-hidden">
                                    ${photoHtml}
                                </div>
                            </div>

                
                            <!-- 4. ព័ត៌មានបុគ្គលិក (ខ្មែរ + ចិន) -->
                            <div class="w-full text-[12px] text-black space-y-1.5 px-1.5 pt-1.5 font-bold leading-relaxed">
                                <p class="flex items-center gap-1">
                                    <span class="shrink-0" style="font-family: 'Khmer OS Bokor', sans-serif;">ឈ្មោះ 姓名:</span>
                                    <span class="font-bold text-slate-900" style="font-family: 'Khmer OS Bokor', sans-serif;">${escapeHtml(emp.NameKhmer || emp.EmployeeName || '-')}</span>
                                </p>
                                <p class="flex items-center gap-1">
                                    <span class="shrink-0" style="font-family: 'Khmer OS Bokor', sans-serif;">អត្តលេខ 工号:</span>
                                    <span class="font-bold font-mono text-black">${escapeHtml(emp.Code || '-')}</span>
                                </p>
                                <p class="flex items-center gap-1 truncate">
                                    <span class="shrink-0" style="font-family: 'Khmer OS Bokor', sans-serif;">ផ្នែក/មុខងារ 部门/职位:</span>
                                    <span class="font-bold text-slate-900 truncate" style="font-family: 'Khmer OS Bokor', sans-serif;">
                                        ${escapeHtml(removeChinese(emp.DepartmentName|| '-'))}
                                    </span>
                                </p>
                                <p class="flex items-center gap-1 text-[12px] truncate">
                                    <span class="shrink-0" style="font-family: 'Khmer OS Bokor', sans-serif;">ថ្ងៃចូលធ្វើការ/入厂日期/StartDate:</span>
                                    <span class="font-bold">${escapeHtml(formatExcelSerialDate(emp.StartDate))}</span>
                                </p>
                            </div>

                           <!-- 5. ហត្ថលេខារដ្ឋបាល -->
                            <div class="text-center text-[10px] font-bold text-black my-1" style="font-family: 'Khmer OS Bokor', cursive, sans-serif;">
                                ហត្ថលេខារដ្ឋបាល និងត្រា 确认人事核可 盖章<span class="font-normal font-bold,style="font-family: 'Noto Sans SC', sans-serif;"></span>
                            </div>

                            <!-- 6. អាសយដ្ឋានខាងក្រោម (ពណ៌ក្រហម) -->
                            <div class="text-center text-[8px] text-black font-bold leading-tight border-t border-slate-100 pt-0.5">
                                <p class="-mt-1">អាសយដ្ឋាន៖ ភូមិ ព្រៃស ខាងកើត សង្កាត់ ព្រៃស ខណ្ឌ ដង្កោ រាជធានីភ្នំពេញ កម្ពុជា</p>
                                <p class="text-[5px] uppercase font-sans">Phum Prey Sor khangLech., Sangkat Prey Sor, Khan Dangkao, Phnom Penh, Cambodia</p>
                            </div>

                        </div>
                    `;
                });

                for (let k = chunk.length; k < 4; k++) {
                    pagesHtml += `<div class="id-card-print invisible"></div>`;
                }

                pagesHtml += `</div></div>`;

                // 2️⃣ ទំព័រខាងក្រោយ (BACK SIDE PAGE)
                pagesHtml += `<div class="a4-page shadow-md mb-6 border border-slate-200"><div class="card-grid back-page-adjust">`;
                
                const backChunk = [
                    chunk[1] || null,
                    chunk[0] || null,
                    chunk[3] || null,
                    chunk[2] || null
                ];

                backChunk.forEach(item => {
                    if (item) {
                        pagesHtml += `
                            <!-- បន្ថែម Link Font នេះទៅក្នុង <head> នៃទំព័រ HTML របស់អ្នក -->

<!-- បន្ថែម Link Font នេះទៅក្នុង <head> នៃទំព័រ HTML របស់អ្នក -->

<div class="id-card-print bg-white border-2 border-slate-400 overflow-hidden text-slate-900 flex flex-col items-center justify-center p-2 shadow-sm rounded-none max-w-md mx-auto">
    <div class="w-full h-full flex flex-col items-center text-center p-2 rounded-sm space-y-1.5">
        
      <!-- Header Section -->
        <div class="w-full text-center space-y-0.5 border-b border-slate-200 pb-1.5 ">
            <h1 class=" text-sm leading-tight font-['Moul',sans-serif] text-[10px]">
                រោងចក្រកាត់ដេរ និងចាច់សម្លៀកបំពាក់
            </h1>
            <h2 class=" text-[10px] leading-snug font-['Moul',sans-serif]">
                លីឌីង ស្ដារ (ខេមបូឌា) ហ្គាមិន ឯ.ក
            </h2>
            <p class=" text-xs leading-snug tracking-wider font-serif">
                承杰(柬埔寨)紡織有限公司
            </p>
            <p class=" font-black text-[8px] tracking-widest uppercase font-['Algerian']">
                LEADING STAR (CAMBODIA) GARMENTS CO., LTD
            </p>
            <h3 class=" font-black text-[10px] pt-0.5 tracking-wide font-['Moul',sans-serif]">
                គោលការណ៍សំខាន់ៗសម្រាប់អនុវត្តន៍៖
            </h3>
        </div>

        <!-- Main Rules (Text size: 9px) -->
        <div class="w-full text-left text-slate-800 font-bold text-[8px] space-y-1 leading-tight pl-1 font-['Khmer OS Battambang',sans-serif]">
            <p>- មុនចូលរោងចក្រត្រូវពាក់កាត បូកសន្ទះត្រចៀក និងកែវភ្នែកឲ្យបានត្រឹមត្រូវ។</p>
            <p>- ត្រូវស្គែនមេដៃចេញ-ចូលឲ្យបានត្រឹមត្រូវ ឬទៀងទាត់។</p>
            <p>- ត្រូវគោរពតួនាទី និងស្តាប់ការចាត់ចែងរបស់ប្រធាន។</p>
            <p>- មិនអនុញ្ញាតឲ្យយករចំណី និងទឹកដែលមានពណ៌ចូលក្នុងរោងចក្រឡើយ។</p>
            <p>- មិនអនុញ្ញាតឲ្យទំពារស្ករគ្រាប់ ឬស្ករកៅស៊ូឡើយ ព្រោះបណ្តាលឲ្យបាត់បង់អនាម័យ។</p>

            <p class=" font-extrabold text-[8px] pt-0.5">
                គោលការណ៍ទីកន្លែងស្អាត អនាម័យល្អ គឺ សុខភាពល្អ។
            </p>

            <p>- មិនត្រូវឈ្លោះប្រកែកគ្នាក្នុងបរិវេណរោងចក្រ។</p>
            <p>- ពេលបាត់កាតត្រូវប្រញាប់រាយការណ៍មកផ្នែករដ្ឋបាល។</p>
            <p>- កាតនេះត្រូវបានផ្តល់ជូនដោយឥតគិតថ្លៃ។</p>

            <p class="font-extrabold text-[8px] pt-0.5">
                នីតិវិធីគណនាប្រាក់ខែ និងប្រាក់ថែមម៉ោង
            </p>

            <p>- ប្រាក់ខែប្រចាំថ្ងៃ = ប្រាក់ខែគោល ÷ ២៦ = ប្រាក់ខែ ១ ថ្ងៃ។</p>
            <p>- ប្រាក់ថែមម៉ោង = ប្រាក់ខែគោល ÷ ២៦ ថ្ងៃ ÷ ៨ ម៉ោង x ១,៥ x ២ = ប្រាក់ឈ្នួលថែមម៉ោងក្នុងមួយថ្ងៃ។</p>
            <p>- ប្រាក់ខែ ថ្ងៃបុណ្យ ឬថ្ងៃអាទិត្យ = ប្រាក់ខែគោល ÷ ២៦ x ២ = ប្រាក់ខែ ថ្ងៃបុណ្យ ឬថ្ងៃអាទិត្យ ៖</p>
        </div>

        <!-- Footer Contact & Address (Text size: 8px) -->

        function downloadPDF() {
            const element = document.getElementById('printPageArea');
            const btn = document.getElementById('btnPdf');
            
            element.classList.add('hide-for-pdf');

            const opt = {
                margin:       0,
                filename:     'Employee_ID_Cards.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, scrollY: 0 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true }
            };

            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> កំពុងទាញយក...`;
            btn.disabled = true;

            html2pdf().set(opt).from(element).toPdf().get('pdf').then((pdf) => {
                const totalPages = pdf.internal.getNumberOfPages();
                const expectedPages = Math.ceil(currentWorkers.length / 4) * 2;
                if (totalPages > expectedPages) {
                    pdf.deletePage(totalPages);
                }
            }).save().then(() => {
                element.classList.remove('hide-for-pdf');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }).catch(err => {
                console.error(err);
                element.classList.remove('hide-for-pdf');
                alert('មានបញ្ហាក្នុងការបង្កើត File PDF!');
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        }

        function formatExcelSerialDate(val) {
            if (!val || val === '-') return '-';
            
            if (typeof val === 'string' && (val.includes('-') || val.includes('/'))) {
                return escapeHtml(val);
            }

            const num = Number(val);
            if (!isNaN(num) && num > 0) {
                const dateObj = new Date(Math.round((num - 25569) * 86400 * 1000));
                if (!isNaN(dateObj.getTime())) {
                    const month = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
                    const day = String(dateObj.getUTCDate()).padStart(2, '0');
                    const year = dateObj.getUTCFullYear();
                    return `${day}-${month}-${year}`;
                }
            }
            return String(val);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
